# 全角色统一使用阿里云百炼 qwen3.7-plus。
runtime:
  language: zh-CN
  random_seed: 7

episode:
  max_turns: 30
  min_turns: 3
  stop_when_stable: true

state:
  floor: 0
  ceiling: 5

reports:
  outputs_dir: outputs/qwen3_7_plus

llm:
  defaults:
    protocol: openai_compatible
    timeout: 60
    json_retries: 1

  companion:
    base_url: https://dashscope.aliyuncs.com/compatible-mode/v1
    api_key_env: DASHSCOPE_API_KEY
    model_name: qwen3.7-plus
    temperature: 0.3
    max_tokens: 2000

  user_thinker:
    base_url: https://dashscope.aliyuncs.com/compatible-mode/v1
    api_key_env: DASHSCOPE_API_KEY
    model_name: qwen3.7-plus
    temperature: 0.3
    max_tokens: 4000

  user_talker:
    base_url: https://dashscope.aliyuncs.com/compatible-mode/v1
    api_key_env: DASHSCOPE_API_KEY
    model_name: qwen3.7-plus
    temperature: 0.5
    max_tokens: 1200

  evaluator:
    base_url: https://dashscope.aliyuncs.com/compatible-mode/v1
    api_key_env: DASHSCOPE_API_KEY
    model_name: qwen3.7-plus
    temperature: 0.0
    max_tokens: 4000

  empathy_evaluator:
    base_url: https://dashscope.aliyuncs.com/compatible-mode/v1
    api_key_env: DASHSCOPE_API_KEY
    model_name: qwen3.7-plus
    temperature: 0.0
    max_tokens: 8000
    timeout: 300

  naturalness_evaluator:
    base_url: https://dashscope.aliyuncs.com/compatible-mode/v1
    api_key_env: DASHSCOPE_API_KEY
    model_name: qwen3.7-plus
    temperature: 0.0
    max_tokens: 8000
    timeout: 300

  human_presence:
    base_url: https://dashscope.aliyuncs.com/compatible-mode/v1
    api_key_env: DASHSCOPE_API_KEY
    model_name: qwen3.7-plus
    temperature: 0.0
    max_tokens: 3000
