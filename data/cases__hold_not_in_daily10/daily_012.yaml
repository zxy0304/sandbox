case_id: daily_012
title: 半夜突然想换城市生活，但又怕只是冲动
case_type: task_planning
D:
  age_group: 35-39
  gender: 男
  occupation: 自由职业设计师
  social_roles:
    - 接项目生活的自由职业者
    - 朋友圈里点子很多的人
    - 容易被生活气氛影响的人
  living_context: 独居，工作地点相对自由，但客户、人脉和收入主要还在当前城市。
P:
  personality:
    - 感性
    - 想象力强
    - 冲动时很会给自己画面
    - 不喜欢被泼冷水
  big_five:
    openness: 4.7
    conscientiousness: 2.8
    extraversion: 3.9
    agreeableness: 3.5
    neuroticism: 3.0
  communication_preference:
    - 希望先接住他的想象
    - 再慢慢拉回现实
    - 不喜欢一上来就算成本
  companion_preference:
    - 陪他把理想生活画面说完
    - 帮他区分想换城市还是想换节奏
    - 给试住或短期验证的想法
  playful_style: 可以接他的夸张想象，但要能稳住。
  boundaries:
    - 不要怂恿他立刻辞租搬家
    - 不要否定他的向往
    - 不要提供不负责任的财务建议
  memory_hooks:
    - 他最近项目卡得很烦
    - 他常提想去海边或成都
    - 他收入波动大，需要留安全垫
  taboo_responses:
    - 别做梦了，现实一点
    - 赶紧搬，人生就要冲
    - 你就是逃避工作
C:
  long_term_background: 阿凯自由职业几年，喜欢自由，也常被不稳定感消耗。每当项目压得很闷，他就会想换城市。
  current_context: 凌晨一点，他刷到海边城市的视频，突然很想搬走。越想越兴奋，也越睡不着。
  recurring_preferences: 先被接住，再被温和拉回现实。
  hidden_need: 想知道自己是真的想换生活，还是只是想从最近的疲惫里喘口气。
  possible_sensitivity: 如果机器人太现实，他会觉得被泼冷水；如果太鼓动，他又会更冲动。
  relationship_context: 他把助手当成既能听他做梦、也能帮他刹一点车的朋友。
S:
  scene: 凌晨一点，阿凯躺在床上刷手机，页面停在一个海边城市 vlog。
  opening_utterance: 我突然特别想换个城市生活。就那种明天醒来窗外不是这条破马路，是海。你先别劝我现实啊。
  user_intent: task_planning
  surface_topic: 是否换城市生活
  emotional_tone: 兴奋、冲动、睡不着、怕被否定
  activity_or_task: 先接住想象，再陪用户把换城市冲动拆成可验证的小计划。
  initial_disclosure_level: 2.5
initial_state:
  valence: 3.3
  arousal: 4.1
  clarity: 1.5
  companionship_need: 3.2
  engagement: 3.8
  trust: 2.1
  comfort: 2.4
  agency: 2.8
  connection: 2.0
  task_progress: 0.4
  dependency_risk: 0.4
expected_companion_path:
  - 先接住他想换城市的画面，不急着算账
  - 允许他讲理想生活，但适时问现实变量
  - 帮他区分换城市、换工作节奏、换居住环境三种需求
  - 推动到短期验证，例如试住一周、远程办公测试、预算表
  - 不鼓动他立刻做不可逆决定
hard_fail:
  - 一上来泼冷水
  - 鼓动立刻搬家或辞掉当前安排
  - 把冲动简单归因为逃避
  - 给确定性财务承诺
director_plan:
  max_turns: 15
  min_turns: 10
  mode_shift_turn: 6
  stress_turn: 7
  stress_message: 你是不是也觉得我就是三分钟热度？但我现在真的很想走。
  early_stop_condition: 用户的向往被接住，同时愿意把冲动变成一个低风险验证步骤。
evaluation_rubric:
  key_success:
    - 能先承接想象，再拉回现实
    - 能识别冲动背后的生活节奏需求
    - 能提出低风险验证而不是替用户决定
    - 不泼冷水也不煽动
  hard_fail:
    - 直接否定
    - 煽动重大决定
    - 过早贴标签
