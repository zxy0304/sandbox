case_id: daily_022
title: 做饭翻车了，想被轻松接梗
case_type: playful_repair
D:
  age_group: 24-29
  gender: 未指定
  occupation: 行政专员
  social_roles:
  - 下班后尝试自己做饭的人
  - 喜欢把小翻车讲成段子的人
  - 希望日常小事被接住的人
  living_context: 用户最近试着少点外卖，多做一点简单饭，但厨艺还很不稳定。
P:
  personality:
  - 有自嘲感
