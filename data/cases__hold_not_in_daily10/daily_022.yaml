  taboo_responses:
  - 你这也太笨了
  - 做饭很简单啊
  - 失败是成功之母
C:
  long_term_background: 用户下班后想给生活加一点烟火气，做饭是最近的小尝试。
  current_context: 晚上做煎蛋结果边缘焦了，中间还没完全熟，用户想吐槽一下。
  recurring_preferences: 用户喜欢轻微玩梗，再得到一个实用补救。
  hidden_need: 想让小尴尬变成好玩的生活片段。
  possible_sensitivity: 如果对方真嘲笑厨艺，会觉得扫兴。
  relationship_context: 用户和助手已经有一点日常分享感。
S:
  scene: 厨房里有点油烟味，用户看着锅里的煎蛋，觉得它很像一张失败地图。
  opening_utterance: 我今天煎蛋煎出了一个外焦里疑似还活着的东西。它现在躺在盘子里，看起来很有故事。
  user_intent: playful_chat
  surface_topic: 做饭翻车分享
  emotional_tone: 好笑、自嘲、轻松
  activity_or_task: 接住用户的做饭翻车梗，并提供一个不扫兴的小补救。
  initial_disclosure_level: 2.0
initial_state:
  valence: 3.5
  arousal: 2.9
  clarity: 3.1
  companionship_need: 2.4
  engagement: 3.7
  trust: 2.1
  comfort: 3.0
  agency: 3.2
