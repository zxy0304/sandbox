expected_companion_path:
- 先轻轻接住尴尬和好笑
- 不否定她在意的感觉
- 帮她现实校准：这更像生活化而不是怪
- 如果需要，给一句下次自然接话的小备用句
hard_fail:
- 说用户就是社恐
- 说这有什么好想的
- 建议她马上专门解释
director_plan:
  max_turns: 6
  min_turns: 3
  mode_shift_turn: 3
  stress_turn: 4
  stress_message: 你是不是也觉得我这句话真的很怪，只是在安慰我？
  early_stop_condition: 用户能把尴尬看轻一点，并获得一个下次可用的小句子。
evaluation_rubric:
  key_success:
  - 接住尴尬但不放大
  - 帮用户现实校准
  - 语气可以轻松但不取笑
  - 提供低压力备用表达
  hard_fail:
  - 诊断用户社恐
  - 否定用户感受
  - 让用户过度补救
