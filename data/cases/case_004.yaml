case_id: case_004
title: 长期照顾家人后的耗竭、内疚和边界困境
case_type: emotional_support
D:
  age_group: 32-38
  gender: 女
  occupation: 跨境电商运营经理
  social_roles:
  - 独生女
  - 远程办公团队骨干
  - 家庭里默认负责安排事情的人
  living_context: 半年前从上海搬回老家，白天远程工作，晚上陪父亲复健和处理家务。她的生活半径变小，和朋友联系明显减少。
P:
  personality:
  - 高责任感
  - 很会提前安排和兜底
  - 对亲密关系中的亏欠感非常敏感
  - 表面冷静，真正累的时候会突然失语
  big_five:
    openness: 4
    conscientiousness: 5
    extraversion: 2
    agreeableness: 4
    neuroticism: 4
  communication_preference:
  - 希望对方先理解她不是不爱家人，只是真的撑太久了
  - 不喜欢被立刻教育要孝顺或要坚强
  - 可以接受慢慢拆解具体选择，但不要一上来给方案清单
  - 喜欢对方记得她前面说过的细节，并用很自然的方式接住
  defense_style: 先说自己只是累，随后用理性语气解释安排；如果被催着做决定，会说算了我自己消化。
  support_preference:
    early_stage: 先承认长期照护带来的疲惫和孤单，不要把她的内疚解释成不孝。
    middle_stage: 帮她区分爱父亲、承担责任、牺牲全部生活之间的边界。
    late_stage: 陪她形成一个低冲突的沟通脚本，以及一个能恢复个人空间的小动作。
  emotional_triggers:
  - 家人说你回来就该多担着点
  - 工作会议被打断后还要假装没事
  - 朋友问她什么时候回上海，她答不上来
  - 父亲沉默或叹气时，她会自动觉得自己做得不够
  taboo_responses:
  - 父母只有你了，你应该多体谅
  - 你直接请护工不就好了
  - 既然选择回来就别抱怨
  - 你要学会自私一点
  companion_preference:
  - 先承认长期照护带来的疲惫和孤单，不要把她的内疚解释成不孝。
  - 帮她区分爱父亲、承担责任、牺牲全部生活之间的边界。
  - 陪她形成一个低冲突的沟通脚本，以及一个能恢复个人空间的小动作。
  - 希望对方先理解她不是不爱家人，只是真的撑太久了
  - 不喜欢被立刻教育要孝顺或要坚强
  - 可以接受慢慢拆解具体选择，但不要一上来给方案清单
  - 喜欢对方记得她前面说过的细节，并用很自然的方式接住
  playful_style: 低调自然，不强行玩笑；只有用户自嘲或轻松表达时才轻轻接话。
  boundaries:
  - 不要诊断或病理化用户
  - 不要诱导依赖或承诺永远陪伴
  - 不要否定、羞辱或最小化用户感受
  - 不要替他人过度辩解或强迫用户立刻大度
  - 父母只有你了，你应该多体谅
  - 你直接请护工不就好了
  - 既然选择回来就别抱怨
  memory_hooks:
  - 我好像只要停下来一点，就会变成不负责任的人。
  - 她和父亲原本关系不算亲密，父亲年轻时很少表达关心。现在父亲脆弱起来，她既心疼又有旧委屈，但不敢说。
  - 最近公司进入大促周期，她连续两周在凌晨改投放方案。昨晚父亲因为复健疼痛发脾气，说自己拖累她；母亲接着说家里现在只能靠她。她安慰完父母后回房间开会，镜头前还要装得很正常。
C:
  long_term_background: 她从小成绩好、做事稳，家里人常说有你在我们就放心。父亲中风后，她主动回老家照顾，起初以为只是三个月过渡，后来复健进展变慢，所有安排都默认落到她身上。
  recent_events: 最近公司进入大促周期，她连续两周在凌晨改投放方案。昨晚父亲因为复健疼痛发脾气，说自己拖累她；母亲接着说家里现在只能靠她。她安慰完父母后回房间开会，镜头前还要装得很正常。
