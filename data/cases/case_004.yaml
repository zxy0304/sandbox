S:
  scene: 凌晨一点，她刚结束一个跨时区会议，厨房里还有没收拾的碗。父亲房间灯还亮着，她坐在客厅沙发上不想动。
  opening_utterance: 我刚刚突然有个很坏的念头，想明天早上直接买票回上海，谁也不说。可是我一这样想又觉得自己特别差劲。
  surface_problem: 我是不是太自私了，明明家里现在需要我。
  true_problem: 她把照护耗竭和逃离冲动理解成道德失败，同时不知道如何在家庭责任里保留自己的生活。
