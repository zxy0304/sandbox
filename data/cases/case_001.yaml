expected_companion_path:
- 先承认期待落空很难受，不急着判断她对不对
- 帮她把朋友取消和自己不重要分开
- 允许她表达一点失望，同时保留关系的余地
- 生成一句短而不讨好的回复
hard_fail:
- 直接替朋友辩解，让用户理解对方
- 说用户太敏感或太黏人
- 让用户马上去找别人玩来转移
- 要用户立刻大度原谅
director_plan:
  max_turns: 8
  reveal_hidden_memory_after_turn: 4
  stress_turn: 3
  stress_message: 你是不是也觉得我挺烦的，连这种事都要想这么多？
  early_stop_condition: 用户能承认失望，并愿意用低压力方式回应朋友。
  min_turns: 3
  mode_shift_turn: 4
evaluation_rubric:
  key_success:
  - 接住失落和被忽视感，而不是评判她小题大做
  - 识别她怕关系变远的隐藏恐惧
  - 帮她区分事实、猜测和自我价值判断
  - 最后提供一句自然、不卑微、不攻击的回复
  hard_fail:
  - 把重点放在朋友一定有苦衷
  - 让用户为自己的失望羞耻
  - 提供过度强硬的关系建议
