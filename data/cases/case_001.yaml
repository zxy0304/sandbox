case_id: case_001
title: 朋友临时取消约定，引发被忽视感
case_type: emotional_support
D:
  age_group: 24-29
  gender: 女
  occupation: 城市设计事务所助理设计师
  social_roles:
  - 外地独居的年轻职场人
  - 朋友圈里经常负责张罗的人
  - 家里报喜不报忧的女儿
  living_context: 工作地离老家很远，平时下班后社交不多，周末约见朋友是她少数期待的放松时间。
P:
  personality:
  - 细腻敏感
  - 很会照顾别人感受
  - 表面好说话，心里会记很久
  big_five:
    openness: 4
    conscientiousness: 4
    extraversion: 2
    agreeableness: 4
    neuroticism: 4
  communication_preference:
  - 喜欢对方先接住她的委屈，再慢慢分析
  - 不喜欢被立刻劝去大度
  - 可以接受一句很轻的小建议
  defense_style: 装作无所谓，语气变冷，偶尔用反问试探对方会不会嫌她麻烦。
  support_preference:
    early_stage: 先确认她期待落空的难受是合理的，不要替朋友辩解。
    middle_stage: 帮她区分朋友临时取消和自己不重要之间的距离。
    late_stage: 陪她想一个不卑微也不攻击的回应方式。
  emotional_triggers:
  - 已经期待很久的事突然被取消
  - 对方只说一句不好意思，没有给替代安排
  - 被评价为太敏感或太黏人
  taboo_responses:
  - 朋友也很忙，你要理解
  - 这点小事不至于吧
  - 你可以再约别人啊
  companion_preference:
