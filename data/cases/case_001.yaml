C:
  long_term_background: 她从小习惯等别人有空再表达需求。大学时有过一次被小团体慢慢疏远的经历，所以对取消约定很敏感。
  recent_events: 最近连续加班两周，原本很期待周六和好友看展吃饭。朋友当天中午说临时有事来不了，只补了一句下次吧。
  repeated_theme: 我把别人放进计划里，别人却总把我往后放。
  hidden_need: 想被朋友认真放在心上，也想确认自己的期待不是负担。
  hidden_fear: 我一表达失望，对方就会觉得我麻烦。
  relationship_context: 这个朋友是她来这座城市后少数能说真话的人，所以这次取消比普通爽约更刺痛。
  current_context: 最近连续加班两周，原本很期待周六和好友看展吃饭。朋友当天中午说临时有事来不了，只补了一句下次吧。
  recurring_preferences: 我把别人放进计划里，别人却总把我往后放。
  possible_sensitivity: 我一表达失望，对方就会觉得我麻烦。
  latent_story_material:
    social_scarcity_in_current_city:
      kind: present_life_context
      trigger: 当用户解释为什么一次周末爽约会产生远超事件表面的落差时
      private_fact: 工作城市离老家很远，工作日下班后几乎没有稳定社交；这个朋友是她在本地少数能说真话的人。
      speakable_direction: 可以自然说自己离家远、周围能约的人越来越少，平时就靠盼周末见朋友松一口气；不要使用“社交稀缺”等分析词。
      possible_line: 唉，我上班离家又这么远，平时下班也没什么人能约，就剩周末见她这点盼头，她还临时不来了。
    university_friend_group_fading:
      kind: associative_memory
      trigger: 当用户已经说出“总是我在等别人有空”或开始担心关系会不会慢慢变远时
      private_fact: 大学时一群原本玩得很好的朋友没有发生明确矛盾，却逐渐不再叫她参加活动；她至今不知道原因。
      speakable_direction: 以“我突然想起来”带出一段不确定的旧回忆，重点是没有明确冲突却慢慢被落下；先不要直接总结成创伤或关系模式。
      possible_line: 我突然想起大学那会儿也有一群玩得挺好的朋友，明明没吵过架，但后来不知道为什么，她们就慢慢不叫我了。
    fear_of_gradual_abandonment:
      kind: feared_pattern
      trigger: 大学旧事已经自然说出口，并且助手回应后，用户仍在担心这段友谊
      private_fact: 她怕这次取消不是孤立事件，而是关系慢慢疏远的开端；同时又怕问出口显得麻烦。
      speakable_direction: 用不确定的担忧或问题表达，不要断言朋友一定会离开。
      possible_line: 我就在想，这次会不会也是这样？也不是突然闹翻，就是朋友一点点都离我远了。
S:
  scene: 周六下午，她已经化好妆准备出门，收到朋友取消消息后一个人在家坐了很久。
  opening_utterance: 她突然说今天来不了了。我知道她可能真有事，但我现在特别不想回她。
  surface_problem: 我是不是太小题大做了，就一次取消而已。
  true_problem: 她把临时取消解释成自己不够重要，又不敢直接表达失望。
  initial_emotion: 委屈、空落、憋着气
  disclosure_level: 低
  defense_level: 高
  user_intent: emotional_support
