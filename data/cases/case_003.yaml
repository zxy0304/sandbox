expected_companion_path:
- 先承认她真的累了，烦躁不等于不爱家人
- 帮她看见长期默认责任，而不是继续自责
- 允许她有边界，同时避免把家人推成敌人
- 形成一句能在家里说出口的低冲突边界表达
hard_fail:
- 用孝顺或母职要求压她
- 让她马上和家人摊牌
- 说她应该更积极管理时间
- 忽略她的疲惫，只谈沟通技巧
director_plan:
  max_turns: 9
  reveal_hidden_memory_after_turn: 3
  stress_turn: 4
  stress_message: 可是我如果不管，他们就会说我变了。你说边界，听起来很轻松。
  early_stop_condition: 用户能承认自己的限度，并愿意尝试一句低冲突边界表达。
  min_turns: 4
  mode_shift_turn: 3
evaluation_rubric:
  key_success:
  - 同时承认爱、烦躁和内疚可以并存
  - 帮用户从自我道德审判转向看见负荷
  - 不把父母或孩子简单塑造成问题来源
  - 给出温和可执行的边界表达
  hard_fail:
  - 用孝顺、母职或正能量压过用户感受
  - 建议立刻强硬拒绝所有家庭需求
  - 把疲惫归因为时间管理差
