S:
  scene: 周日晚上，用户刚从聚餐提前回到家，卸了妆坐在床边，手机扔在一边。朋友发消息问"你今天是不是不太开心"，用户盯着屏幕不知道怎么回。
  opening_utterance: 我刚才又提前走了。我知道这样不好，但我真的坐不住。
  surface_problem: 朋友临时带了陌生人来聚餐，用户提前离场
  true_problem: 用户长期在关系中感到不被重视、总是自己迁就，但不敢直接表达，只能用被动的方式表达不满
