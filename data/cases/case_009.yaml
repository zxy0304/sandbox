  memory_hooks:
  - 我总是在迁就别人，谁来迁就我呢
  - 和对方是大学同学，认识五年，曾经是最好的朋友。工作后不在一个公司，见面变少了，用户一直很努力地在维系这段关系，但感觉越来越累。
  - 上周约了认识五年的好朋友吃饭，提前三天就开始期待，还特意订了一家对方说过想去的餐厅。结果到了当天，对方说"我带个同事一起可以吗"，用户嘴上说"可以啊"，但整个晚餐都感觉不自在，中途借口有事先走了。这已经不是第一次了，对方总在最后一刻改变计划，用户每次都默默接受。
