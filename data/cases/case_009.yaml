case_id: case_009
title: 总是主动联系朋友，却感觉自己是多余的
case_type: emotional_support
source_evidence:
  platform: 澎湃新闻·读者真实征集
  source_type: 读者匿名征集投稿
  url: https://www.thepaper.cn/newsDetail_forward_29461438
  title_or_post_summary: 我爱你，但不喜欢你——那些友谊中的"不舒服时刻"
  author_or_channel: 理想的朋友
  published_at: 2024-12-04
  evidence_summary: 读者匿名投稿：自己很珍视和朋友的约定，但朋友总放鸽子，或者到了约定地点临时加人。嘴上说不介意，其实心里非常不舒服。没有跟朋友表明过，只是用"提前走"的方式默默表达不满。感觉自己总是主动的那一方，很累。
  reliability_note: 来源为媒体发起的匿名征集，投稿内容经过编辑审核发布。情绪结构和关系模式具有真实代表性。D/P字段为基于表达风格的合理推断。
