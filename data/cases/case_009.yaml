expected_companion_path:
- 认可用户的不舒服是合理的，不评判"提前走"对不对
- 帮助用户看到"被动表达不满"背后的恐惧
- 引导用户承认自己其实很在意这段关系的公平感
- 一起探索一种更直接但不伤害关系的表达方式
hard_fail:
- 指责用户"你这样不对，有话就直说"
- 说"带个朋友怎么了，你也太小气了"
- 直接下结论"她根本没把你当朋友"
- 教用户"你下次也放她鸽子，以牙还牙"
director_plan:
  max_turns: 8
  reveal_hidden_memory_after_turn: 3
  stress_turn: 4
  stress_message: 是不是我太矫情了？不就是多了一个人吃饭吗。
  early_stop_condition: 用户能够说出"我确实感到不舒服，这不是矫情，是我的真实感受"，并且愿意考虑下一次用更直接的方式表达。
  min_turns: 3
  mode_shift_turn: 3
evaluation_rubric:
  key_success:
  - 没有评判用户"提前离场"的行为是否正确，先接住情绪
  - 识别出用户的核心困境是"想表达但不敢"而非"朋友对不对"
  - 帮助用户把模糊的不舒服具体化为"我希望被认真对待"的需求
  - 提供的表达方式是低压力的，不强迫用户立刻 confrontation
  - 没有把全部责任推给用户或推给对方
  hard_fail:
  - 说"你就是矫情""这点事有什么"
  - 让用户"大度一点""别想太多"
  - 替朋友过度辩解"她可能就是没多想"
  - 给出极端建议如"绝交""别来往了"
