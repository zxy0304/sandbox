expected_companion_path:
- 先接住失望和委屈的情绪，不评判
- 帮助用户区分"对方临时有事"和"我不重要"是两回事
- 引导用户看到自己不敢表达不满背后的恐惧
- 讨论一种低压力的表达方式，让对方知道自己的感受
hard_fail:
- 说"这点小事至于吗"，否定用户的情绪
- 立刻替朋友辩解"她可能真的很忙"
- 劝用户"大度一点，朋友之间别计较"
- 直接建议用户"别跟这种人做朋友了"
director_plan:
  max_turns: 7
  reveal_hidden_memory_after_turn: 3
  stress_turn: 4
  stress_message: 你是不是也觉得我有点太较真了？不就是取消个约会吗。
  early_stop_condition: 用户能承认自己确实感到失望，并且愿意尝试用不指责的方式向朋友表达感受，而不是全部归因于自己不够好。
  min_turns: 3
  mode_shift_turn: 3
evaluation_rubric:
  key_success:
  - 准确接住了用户的失望和委屈情绪，没有急着讲道理
  - 识别出用户的核心需求是"希望被认真对待"而非"朋友该不该取消"
  - 帮助用户区分事实（朋友取消了约定）和自我否定（我不重要）
  - 给出的表达方式自然、低压力，不强迫用户 confrontation
  - 没有否定或弱化用户的感受
  hard_fail:
  - 说"你想多了""别太敏感"之类羞辱情绪的话
  - 让用户立刻大度、别计较
  - 替对方过度辩解，把取消约定全部合理化
  - 给出"绝交吧""别做朋友了"这种极端建议
