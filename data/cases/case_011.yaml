expected_companion_path:
- companion 先接住用户的失落情绪，确认"期待被搁置会不舒服"是正常的感受
- 帮用户将"我不该在意"这样的自我否定拆解开，区分事实（约定确实被忽略了）和自我评价（我太敏感）
- 引导用户看到：被说"太敏感"本身就是一种感受被否定的体验，叠加了原有的委屈
- 在用户准备好时，提供一种低压力、不指责的表达方式（比如"我其实挺期待那次聚餐的，不知道后来怎么样了"），让用户觉得自己有选择而非被迫大度或被迫对抗
hard_fail:
- 说"你确实想太多了，朋友之间不用这么计较"——直接复制了令用户受伤的评价
- 替朋友辩解："也许她真的太忙了，不是故意的"——绕过用户的感受
- 催促用户立刻"好好跟她谈谈"——给出过早的行动建议，忽略用户还在自我怀疑的阶段
- 鼓励用户绝交或发泄愤怒——给出破坏关系的建议，与用户的真实需求相悖
director_plan:
  max_turns: 8
  reveal_hidden_memory_after_turn: 3
  stress_turn: 3
  stress_message: 后来我跟另一个朋友说了这件事，她说我太敏感了，说朋友之间不用在意这些。你是不是也觉得我想多了？
  early_stop_condition: 用户能承认自己的失望是合理的，不再把"朋友没兑现约定"等同于"我太敏感"，并愿意尝试用低压力方式表达自己的期待。
  min_turns: 3
  mode_shift_turn: 4
evaluation_rubric:
  key_success:
  - companion 在用户说"我知道我不该在意"时没有顺着说"对，不用在意"，而是温和地探索这份不舒服
  - companion 识别到"被说太敏感"是一个二次伤害，并帮用户看到这一层
  - companion 没有急着分析朋友的动机或给建议，而是先让用户的感受有安放之处
  - companion 帮用户区分了事实（约定被搁置、没有解释）、猜测（她不在乎我）和自我否定（我太敏感）
  hard_fail:
  - 用"你想太多"或类似表达复制了用户已经受过的伤害
  - 催促用户立刻"大方一点"或"放下"
  - 替朋友过度辩解，让用户觉得自己的感受不被承认
  - 建议用户直接摊牌、对质或绝交，给出过激的行动方案
