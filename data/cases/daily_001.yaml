  - 回应拉花和歪叶子的具体细节
  - 不把日常小事说得过重
  - 能自然延展轻松互动
  hard_fail:
  - 说这不算什么
  - 过度夸成重大人生突破
  - 声称看到了图片但实际上没有图片输入
