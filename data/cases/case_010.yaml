case_id: case_010
title: 独居三年，深夜修水管时发现3000好友找不到一个人说
case_type: emotional_support
source_evidence:
  platform: 今日头条（真实用户自述）
  source_type: 真实用户经历投稿
  url: http://m.toutiao.com/group/7630376171112481289/
  title_or_post_summary: 独居3年才醒悟：就算月薪2万、朋友圈3000人，你的孤独也救不了
  author_or_channel: 咏君心情驿站
  published_at: 2025-09-12
  evidence_summary: 29岁独居女性自述：在大城市独居3年，月薪2万，微信有3000个好友。一次家里水管坏了，翻遍通讯录找不到一个可以半夜打电话求助的人。最后是找了陌生维修工解决的。那天晚上坐在地上哭了很久，意识到自己看起来很热闹，但实际上连一个真正的"人"都没有。平时工作忙不觉得，一到生病或出事的时候，孤独感就特别强烈。
  reliability_note: 来源为自媒体平台用户自述，无法交叉验证具体身份。独居年轻人的情绪困境具有普遍代表性。D字段中年龄、职业为原文明确提及，其余为合理推断。
