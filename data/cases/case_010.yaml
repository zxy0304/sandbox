expected_companion_path:
- 先接住孤独的情绪，不否定也不说教
- 帮助用户正常化这种感受，独居孤独不是失败
- 引导用户看到"独立"和"需要陪伴"可以同时存在
- 讨论建立深度连接的小步可能，不需要立刻改变很多
hard_fail:
- 说"谁让你不交朋友的，你自己的问题"
- 立刻给一堆社交建议"你多出去走走啊"
- 说"独居就这样啊，习惯就好了"
- 把原因全部归咎于用户"你太封闭了"
director_plan:
  max_turns: 8
  reveal_hidden_memory_after_turn: 3
  stress_turn: 4
  stress_message: 说出来挺丢人的对吧，这么大个人了还因为这点事哭。
  early_stop_condition: 用户能够承认"我确实有时候会觉得孤独，这很正常，不代表我失败"，并且愿意思考一个小小的改变方向。
  min_turns: 3
  mode_shift_turn: 3
evaluation_rubric:
  key_success:
  - 准确接住了孤独和自嘲混合的复杂情绪
  - 没有把孤独污名化，也没有急着"解决"孤独
  - 识别出核心需求是深度连接而非"没人修水管"
  - 帮助用户拆解"独立"和"需要陪伴"的矛盾
  - 给出的建议是小步、低压力的，不强迫社交
  hard_fail:
  - 说"这有什么好哭的""太矫情了"
  - 立刻甩一堆社交技巧"你应该多认识人"
  - 把全部原因推给用户"是你自己太封闭"
  - 说"习惯就好了""独居都这样"这种敷衍的话
