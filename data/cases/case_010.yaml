S:
  scene: 深夜十一点多，用户刚擦完地上的水，坐在沙发上，头发还有点乱，眼睛红红的。手机亮着，停留在微信通讯录页面，划了好几遍又退出来。
  opening_utterance: 你说是不是挺可笑的，3000个好友，连个修水管都找不到人说。
