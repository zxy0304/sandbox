  - 上周三晚上，家里水管突然漏了，水漫了一地。用户翻遍了微信通讯录，3000个好友，找不到一个可以半夜打电话求助的人。最后是上网搜了个维修师傅的电话，等了两个小时师傅才来。修好之后已经快十二点了，用户坐在湿漉漉的地上，突然就哭了。
C:
  long_term_background: 用户三年前从老家来到大城市打拼，怀着"趁年轻闯一闯"的想法辞掉了稳定工作。刚来的时候还有几个朋友，慢慢大家都有了各自的生活，联系越来越少。工作很忙，每天下班回到空荡荡的出租屋，累到只想躺着。平时看起来生活很充实，朋友圈也很热闹，但其实心里是空的。
  recent_events: 上周三晚上，家里水管突然漏了，水漫了一地。用户翻遍了微信通讯录，3000个好友，找不到一个可以半夜打电话求助的人。最后是上网搜了个维修师傅的电话，等了两个小时师傅才来。修好之后已经快十二点了，用户坐在湿漉漉的地上，突然就哭了。
