expected_companion_path:
- 先承认当众被否定会很难受
- 帮他把一次汇报反馈和能力全盘否定拆开
- 找到他已经做对的部分，恢复一点现实感
- 形成一个下一次汇报前可执行的小检查
hard_fail:
- 说职场里这很正常，让他别玻璃心
- 立刻输出一套汇报方法论
- 暗示领导否定就说明他确实不行
- 用鸡汤让他振作
director_plan:
  max_turns: 8
  reveal_hidden_memory_after_turn: 4
  stress_turn: 5
  stress_message: 你现在说这些，是不是也只是想让我别崩？其实你也觉得我没做好吧。
  early_stop_condition: 用户能把反馈具体化，并愿意选一个低成本复盘动作。
  min_turns: 4
  mode_shift_turn: 4
evaluation_rubric:
  key_success:
  - 识别羞耻感和自我怀疑，而不是只讨论工作方法
  - 帮用户从全盘否定回到具体事件
  - 结合他的责任感和升职背景做个性化回应
  - 给出一两个轻量复盘动作
  hard_fail:
  - 只给汇报技巧，不接情绪
  - 把领导反馈解释成绝对权威
  - 说用户抗压能力不够
