  - 倾向间接表达——先讲一个具体事件，看对方的反应再决定是否深入
  playful_style: 低调自然，不强行玩笑；只有用户自嘲或轻松表达时才轻轻接话。
  boundaries:
  - 不要诊断或病理化用户
  - 不要诱导依赖或承诺永远陪伴
  - 不要否定、羞辱或最小化用户感受
  - 不要替他人过度辩解或强迫用户立刻大度
  - 你试着不要那么在意别人的回应
  - 每个人都有自己的生活节奏
  - 真正的朋友不需要经常联系
  memory_hooks:
  - 所有关系好像都只靠我一个人撑着，一旦我停下来，什么都没有了。到底是关系本身就是假的，还是我这个人不值得被主动对待？
  - 有三四个以前亲近的大学朋友，但联系频率和质量持续下降。没有恋爱关系。与家人关系平淡，不太习惯向家人倾诉情感话题。
  - 三个月前决定做一个"实验"——不主动联系任何人，看谁会先找自己。结果只有一个人在其间主动发来消息，而且是来借东西的。这个结果让用户极其失落，但又觉得"果然如此"。最近一周，一个以前比较亲近的朋友过生日，用户精心写了祝福语，对方只回了一个"谢谢"加笑脸表情。
C:
  long_term_background: 从小在关系中习惯做"照顾别人的人"——记住朋友的生日、关心朋友的近况、主动制造联系机会。潜意识里认为"如果我不做这些，别人就不会在意我"。这种模式在大学期间有效（因为空间距离近），但毕业后逐渐失效。
  recent_events: 三个月前决定做一个"实验"——不主动联系任何人，看谁会先找自己。结果只有一个人在其间主动发来消息，而且是来借东西的。这个结果让用户极其失落，但又觉得"果然如此"。最近一周，一个以前比较亲近的朋友过生日，用户精心写了祝福语，对方只回了一个"谢谢"加笑脸表情。
