case_id: case_013
title: 总是我先发消息——如果我不主动，这段友情就没了
case_type: emotional_support
source_evidence:
  platform: YouTube
  source_type: 视频内容及评论区用户讨论
  url: https://www.youtube.com/watch?v=Q8QxTRI72js
  title_or_post_summary: Big Think 频道视频 "Everything You Need to Know About Loneliness"（2026年5月发布），三位专家从心理学与社会学角度探讨"友谊衰退"（friendship recession）现象。视频讨论了亲密朋友数量减少、单向维系关系的疲惫感。评论区有大量用户分享"总是自己主动联系，停下来后友谊就消失了"的真实经历。该主题在多个中文平台（豆瓣小组 topic/344484873、壹心理问答等）同样有大量公开讨论。
  author_or_channel: Big Think (YouTube)
  published_at: 2026-05-21
  evidence_summary: 视频阐述了成年人友谊衰退的社会趋势，指出亲密朋友减少已成为全球性现象。评论区大量用户分享亲身经历，反复出现的主题包括："如果我不主动发消息，没有人会找我""我试过不主动，结果三个月没人联系我""总在想是不是我的问题"。豆瓣小组和壹心理平台也有多条类似讨论贴，印证了"单向维系友谊"是中文互联网上年轻人广泛讨论的情感话题。
  reliability_note: 核心来源为 YouTube 公开视频（可验证），辅以豆瓣小组帖子的搜索摘要。评论区观点基于搜索引擎返回的摘要片段归纳，具体评论可能因平台更新而有变动。案例画像基于多条来源中反复出现的共性经历匿名化创作。
D:
  age_group: 24-28岁
  gender: 未明确
  occupation: 工作两三年的职场人
  social_roles:
  - 朋友圈中长期担当"主动联系者"的角色
  - 在关系中偏向付出型
  living_context: 城市独居，大学朋友分散在不同城市，工作社交未能转化为私人友谊
P:
  personality:
  - 对关系中的不对等高度敏感但不轻易表达
  - 善于观察他人的回应细节（已读不回、回复速度等）
  - 倾向于在内心反复复盘，而非对外表达不满
  - 有一定的"讨好型"倾向——害怕主动提需求
  big_five:
    openness: 3.2
    conscientiousness: 3.8
    extraversion: 3.0
    agreeableness: 4.5
    neuroticism: 3.8
  communication_preference:
  - 希望对方能察觉自己的情绪而非需要自己完全说出来
  - 不喜欢"你应该跟对方说清楚"这样的直接建议
  - 倾向间接表达——先讲一个具体事件，看对方的反应再决定是否深入
  defense_style: 退缩/测试——通过"不主动联系看对方反应"来验证自己在关系中的位置，但测试结果往往加深失落
  support_preference:
    early_stage: 需要有人承认"单方面主动确实会累"，而不是被教育"关系就是需要维护的"
    middle_stage: 希望有人帮自己分辨"哪些关系值得继续投入""哪些关系自然淡了不是我的错"
    late_stage: 希望获得重新定义友谊期待的框架——不再用"对方主不主动"作为衡量关系价值的唯一标准
  emotional_triggers:
  - 自己精心编辑的消息只换来一个表情或简短回复
  - 朋友在朋友圈活跃但不回自己的私信
  - 试过不主动联系后发现真的没人找自己
  taboo_responses:
  - 你试着不要那么在意别人的回应
  - 每个人都有自己的生活节奏
  - 真正的朋友不需要经常联系
  - 你需要学会享受独处
  companion_preference:
  - 需要有人承认"单方面主动确实会累"，而不是被教育"关系就是需要维护的"
  - 希望有人帮自己分辨"哪些关系值得继续投入""哪些关系自然淡了不是我的错"
  - 希望获得重新定义友谊期待的框架——不再用"对方主不主动"作为衡量关系价值的唯一标准
