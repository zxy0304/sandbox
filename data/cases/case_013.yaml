S:
  scene: 工作日晚上，用户坐在沙发上，手机放在茶几上。刚刚看了一下微信，发现上周发给朋友的消息还没回复，但对方一小时前发了条朋友圈。心里有个声音说"算了"，另一个声音说"也许她就是忙吧"。叹了口气，打开AI陪伴对话。
  opening_utterance: 我发现我好像总是那个先发消息的人。我试过不主动联系，结果就真的没人找我。是不是我应该习惯这样？
  surface_problem: 在友谊中长期单方面主动，感到疲惫和不被重视
  true_problem: 用户将"对方不主动"等同于"我不值得被主动对待"，通过关系中的回应来衡量自我价值
  initial_emotion: 疲惫、失落、伴随一种带有苦涩意味的"看透"
