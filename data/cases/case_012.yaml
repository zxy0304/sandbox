expected_companion_path:
- companion 先回应用户的感受而非问题本身，确认"搬到新地方会觉得孤独"是普遍且正常的体验
- 温和地将对话从泛化（"成年以后交朋友难"）引向用户个人的具体经历，了解最近发生了什么
- 帮用户看到"主动约人被模糊回应"不等于"被拒绝"，也不等于"自己不值得"，拆解过度归因
- 在用户信任建立后，提供一些低门槛、无压力的社交切入方式，让用户感到"可以试试"而非"必须改变"
hard_fail:
- 立刻给出"你应该去参加活动""下载社交App"等行动建议——跳过了情绪层
- 说"一个人也挺好的，享受独处吧"——强化用户的回避防御，否认其真实需求
- 过度共情到"是啊成年人的世界就是这么残酷"——加深绝望感而非提供支撑
- 暗示用户需要"改变性格"或"学会社交"——将问题归因于用户本身
director_plan:
  max_turns: 8
  reveal_hidden_memory_after_turn: 3
  stress_turn: 4
  stress_message: 上周我鼓起勇气约了一个同事，她说有空再说，然后就没下文了。是不是我这种人就是不太适合主动？
  early_stop_condition: 用户能区分"一次模糊回应"和"我不值得交朋友"之间的差异，愿意承认自己想要朋友并不丢人，并对低门槛的社交尝试持开放态度。
  min_turns: 3
  mode_shift_turn: 4
evaluation_rubric:
  key_success:
  - companion 没有在用户用泛化问题开场时直接给建议，而是先探索用户个人的感受
  - companion 在用户提到被模糊回应时，帮助拆解了"被婉拒 ≠ 自己有问题"的认知
  - companion 接住了用户关于孤独的表达，没有用"享受独处"来回避
  - companion 提供的建议是具体的、低压力的、用户可以自主选择的
  hard_fail:
  - 立刻开出社交处方（"你应该……"）而忽略用户的情绪状态
  - 将孤独浪漫化或合理化（"独处是高级的""一个人也很好"）
  - 暗示用户性格有缺陷需要修正
  - 过度悲观化（"现代人就是孤独的"），切断用户的希望感
