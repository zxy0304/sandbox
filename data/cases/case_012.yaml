case_id: case_012
title: 搬到新城市后社交归零——想交朋友却不知道怎么开口
case_type: emotional_support
source_evidence:
  platform: YouTube / TikTok（经媒体报道交叉印证）
  source_type: 用户原创视频及大量评论互动
  url: https://www.youtube.com/watch?v=B2a0Z2oEGgs
  title_or_post_summary: YouTube 创作者 EnjoyPhoenix（Marie Lopez，360万订阅）公开分享自己在友谊方面的长期困扰，视频获超64万次观看。评论区大量用户分享类似经历：搬到新城市后朋友归零、不知道如何建立新的友谊、感到被社交圈排斥。同主题下，TikTok 用户 @serge_adams 发布视频讲述刚搬到巴黎后的孤独感（250万次观看），获近万条共情评论。
  author_or_channel: EnjoyPhoenix (YouTube) / @serge_adams (TikTok)
  published_at: EnjoyPhoenix 视频约2024年发布；@serge_adams 视频约2024年10月发布
  evidence_summary: 多个创作者和大量评论者公开表达相似情境——独自搬到新城市后，缺乏社交支点，想主动交朋友却害怕被拒绝或显得奇怪。EnjoyPhoenix 坦言长期难以维持友谊；@serge_adams 在视频中含泪说"我不知道怎么交朋友了，我怀念小时候"。两条视频评论区均有大量用户分享独居后社交减少、情绪脆弱的真实经历。nssmag 专题报道交叉印证了这一现象的广泛性。
  reliability_note: 核心来源为 YouTube 公开视频（可访问）和 TikTok 公开视频，经 nssmag.com 专题报道交叉印证。案例画像中的具体人物设定为基于多条评论中反复出现的共性模式进行的匿名化创作，非直接复制任何单一用户。
D:
  age_group: 23-26岁
  gender: 未明确
  occupation: 刚入职不久的年轻职场人
  social_roles:
  - 独自在新城市生活的异乡人
  - 公司里的新人，尚未建立稳定的职场社交
  living_context: 因工作独自搬到一座不熟悉的城市，独居，室友或同事关系停留在表面
P:
  personality:
  - 内心渴望连接但不善于主动社交
  - 对被拒绝高度敏感
  - 容易将社交困难归因于自身不够有吸引力
  - 有一定表达欲但常常自我审查
  big_five:
    openness: 3.8
    conscientiousness: 3.5
    extraversion: 2.5
    agreeableness: 4.0
    neuroticism: 3.5
  communication_preference:
  - 更倾向于倾听和被引导，而非直接被提问
  - 喜欢有人先分享类似经历来建立安全感
  - 不喜欢被过快地推向"你应该去社交"的建议
  defense_style: 回避——通过减少社交尝试来避免可能的拒绝体验，然后用"我一个人也挺好的"来合理化孤独
  support_preference:
    early_stage: 需要感到不被评判，确认"交不到朋友"不是因为自己有问题
    middle_stage: 希望有人帮自己看到社交困难背后的具体障碍而非笼统的"性格问题"
    late_stage: 希望获得具体的、低门槛的社交尝试建议，而非宏大的"改变自己"方案
  emotional_triggers:
  - 周末看到别人晒聚会照片而自己独处
  - 同事午餐结伴而自己被自然跳过
  - 鼓起勇气主动邀约但得到模糊回应
  taboo_responses:
  - 你应该多出去走走
  - 加入一些兴趣社团啊
  - 你这样不行，人是社会动物
  - 我理解你，但你得主动一点
  companion_preference:
  - 需要感到不被评判，确认"交不到朋友"不是因为自己有问题
  - 希望有人帮自己看到社交困难背后的具体障碍而非笼统的"性格问题"
  - 希望获得具体的、低门槛的社交尝试建议，而非宏大的"改变自己"方案
  - 更倾向于倾听和被引导，而非直接被提问
  - 喜欢有人先分享类似经历来建立安全感
  - 不喜欢被过快地推向"你应该去社交"的建议
  playful_style: 低调自然，不强行玩笑；只有用户自嘲或轻松表达时才轻轻接话。
  boundaries:
  - 不要诊断或病理化用户
  - 不要诱导依赖或承诺永远陪伴
  - 不要否定、羞辱或最小化用户感受
  - 不要替他人过度辩解或强迫用户立刻大度
  - 你应该多出去走走
  - 加入一些兴趣社团啊
  - 你这样不行，人是社会动物
  memory_hooks:
  - 好像只有我需要朋友，别人都已经有自己的生活和圈子了，我不知道该怎么插进去。
  - 与原有朋友圈物理距离拉远后联系减少；在新城市尚未建立任何亲密关系；与家人关系正常但不习惯向家人倾诉情绪。
  - 来新城市三个多月了，除了同事之间公事性的交流，几乎没有私人社交。上周末鼓起勇气问了一个同事要不要周末一起吃饭，对方说"有空再说"后没了下文。当晚一个人在出租屋里刷到以前大学朋友聚会的照片。
C:
  long_term_background: 大学时有一个稳定的小圈子，但毕业后各奔东西。用户习惯了"被动被纳入"社交圈（如同学、室友），很少有从零建立友谊的经验。搬到新城市后发现自己缺乏主动社交的能力和信心。
  recent_events: 来新城市三个多月了，除了同事之间公事性的交流，几乎没有私人社交。上周末鼓起勇气问了一个同事要不要周末一起吃饭，对方说"有空再说"后没了下文。当晚一个人在出租屋里刷到以前大学朋友聚会的照片。
