  hidden_need: 想要确认"想要朋友"这件事不丢人，自己不是因为有什么问题才交不到朋友。
  hidden_fear: 如果连主动约人都被婉拒了，是不是说明自己真的不够有趣、不值得被人当朋友。
  relationship_context: 与原有朋友圈物理距离拉远后联系减少；在新城市尚未建立任何亲密关系；与家人关系正常但不习惯向家人倾诉情绪。
  current_context: 来新城市三个多月了，除了同事之间公事性的交流，几乎没有私人社交。上周末鼓起勇气问了一个同事要不要周末一起吃饭，对方说"有空再说"后没了下文。当晚一个人在出租屋里刷到以前大学朋友聚会的照片。
  recurring_preferences: 好像只有我需要朋友，别人都已经有自己的生活和圈子了，我不知道该怎么插进去。
  possible_sensitivity: 如果连主动约人都被婉拒了，是不是说明自己真的不够有趣、不值得被人当朋友。
S:
  scene: 周六晚上八点，用户独自在出租屋里，外面下着雨。刷了一个小时社交媒体，看到大学同学在另一座城市的聚会照片，也看到同事周末去露营的动态。关掉手机，觉得房间特别安静。犹豫了一下，打开AI陪伴对话。
  opening_utterance: 你有没有觉得，成年以后交朋友变得特别难？我来这个城市快四个月了，好像还是一个人。
  surface_problem: 搬到新城市后交不到朋友，感到孤独
  true_problem: 用户将社交困难内化为自我价值问题（"是不是我不够好"），回避社交的同时又为孤独感到痛苦
  initial_emotion: 孤独、轻微的自我怀疑、带着一点无奈的平静
  disclosure_level: 低到中等——用泛化问题（"成年以后交朋友难"）来试探，而非直接暴露自己的脆弱
  defense_level: 中等——用"你有没有觉得"来转移焦点，避免直接承认自己的孤独
  user_intent: emotional_support
  surface_topic: 搬到新城市后交不到朋友，感到孤独
  emotional_tone: 孤独、轻微的自我怀疑、带着一点无奈的平静
  activity_or_task: 接住搬到新城市后的孤独和无从下手，区分社交困难和自我价值，并设计一个低压力交友小步。
  initial_disclosure_level: 低到中等——用泛化问题（"成年以后交朋友难"）来试探，而非直接暴露自己的脆弱
